<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no,date=no,email=no,address=no" />
    <meta name="theme-color" content="#0d3028" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>雙人 13 張麻將</title>
    <meta
      name="description"
      content="本機與平板可用的雙人 13 張麻將，支援單機與 Firebase 房間模式。"
    />
    <style>
      #app-version-badge {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 9999;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(12, 42, 35, 0.92);
        color: #f5ecd6;
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
        font: 700 12px/1.2 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        letter-spacing: 0.02em;
      }

      #app-version-badge,
      #app-version-badge *,
      #app-version-badge a {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff;
        text-decoration: none !important;
      }
    </style>
    <link rel="icon" href="data:," />
    <script>
      window.__APP_VERSION__ = "20260506-004610";
      document.documentElement.dataset.appVersion = window.__APP_VERSION__;

      document.addEventListener("DOMContentLoaded", function () {
        var badge = document.getElementById("app-version-badge");
        if (badge) {
          badge.textContent = "版號 " + window.__APP_VERSION__;
        }
      });
    </script>
    <script>
      (function () {
        var host = (window.location && window.location.hostname) || "";
        var isLocalDevHost =
          host === "localhost" ||
          host === "127.0.0.1" ||
          /^192\.168\./.test(host) ||
          /^10\./.test(host) ||
          /^172\.(1[6-9]|2\d|3[0-1])\./.test(host);
        window.__IS_LOCAL_DEV_HOST__ = isLocalDevHost;

        if (!window.__IS_LOCAL_DEV_HOST__ || typeof window.fetch !== "function" || typeof window.URL !== "function") {
          return;
        }

        var currentVersion = String(window.__APP_VERSION__ || "");
        var currentUrl = new URL(window.location.href);

        function buildVersionedUrl(version) {
          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.delete("__version_probe__");
          nextUrl.searchParams.set("v", version);
          return nextUrl.toString();
        }

        function normalizeVersionUrl(version) {
          if (!version) {
            return;
          }

          if (currentUrl.searchParams.get("v") === version) {
            return;
          }

          window.history.replaceState(null, "", buildVersionedUrl(version));
        }

        fetch("./?__version_probe__=" + Date.now(), {
          cache: "no-store",
          credentials: "same-origin",
        })
          .then(function (response) {
            return response.text();
          })
          .then(function (html) {
            var match = html.match(/window\.__APP_VERSION__ = "([^"]+)"/);
            var latestVersion = match ? String(match[1] || "") : "";

            if (!latestVersion) {
              normalizeVersionUrl(currentVersion);
              return;
            }

            if (latestVersion !== currentVersion) {
              window.location.replace(buildVersionedUrl(latestVersion));
              return;
            }

            normalizeVersionUrl(latestVersion);
          })
          .catch(function () {
            normalizeVersionUrl(currentVersion);
          });
      })();
    </script>
    <script>
      (function () {
        var root =
          typeof globalThis !== "undefined"
            ? globalThis
            : typeof self !== "undefined"
              ? self
              : typeof window !== "undefined"
                ? window
                : {};
        var cryptoApi = root.crypto;

        if (!cryptoApi || typeof cryptoApi.randomUUID === "function" || typeof cryptoApi.getRandomValues !== "function") {
          return;
        }

        cryptoApi.randomUUID = function () {
          var bytes = new Uint8Array(16);
          cryptoApi.getRandomValues(bytes);
          bytes[6] = (bytes[6] & 15) | 64;
          bytes[8] = (bytes[8] & 63) | 128;

          var hex = "";
          for (var index = 0; index < bytes.length; index += 1) {
            var value = bytes[index].toString(16);
            hex += value.length < 2 ? "0" + value : value;
          }

          return (
            hex.slice(0, 8) +
            "-" +
            hex.slice(8, 12) +
            "-" +
            hex.slice(12, 16) +
            "-" +
            hex.slice(16, 20) +
            "-" +
            hex.slice(20)
          );
        };
      })();
    </script>
  </head>
  <body>
    <div id="app-version-badge">版號 20260506-004610</div>
    <div id="boot-warning" class="banner banner-error" hidden>
      <span id="boot-warning-text">
        載入遊戲時發生問題，請重新整理頁面；如果是在 iPad Safari，也可以先回到首頁再重新進入。
      </span>
    </div>
    <!-- Legacy migration fallback contract: id="game-panel" -->
    <div id="app-root"></div>
    <script>
      (function () {
        var warning = document.getElementById("boot-warning");
        var warningText = document.getElementById("boot-warning-text");

        function showBootWarning(message) {
          if (warningText && message) {
            warningText.textContent = message;
          }
          if (warning) {
            warning.hidden = false;
          }
        }

        window.addEventListener("error", function (event) {
          if (document.documentElement.dataset.appReady === "yes") {
            return;
          }

          var errorMessage =
            (event.error && event.error.message) ||
            event.message ||
            "Unknown error";
          showBootWarning("載入遊戲時發生錯誤：" + errorMessage);
        });

        window.addEventListener("unhandledrejection", function (event) {
          if (document.documentElement.dataset.appReady === "yes") {
            return;
          }

          var reason = event.reason;
          var errorMessage =
            (reason && reason.message) ||
            (typeof reason === "string" ? reason : "Unknown error");
          showBootWarning("載入遊戲時發生錯誤：" + errorMessage);
        });
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
